# Swipe app in Docker: `bun run docker:up` (= docker compose up -d --build).
# Reads INGEST_TOKEN, COOKIE_SECURE and TRUST_PROXY from .env; HOST, PORT and
# DB_PATH are fixed for the container. The DB lives in the `wohnung-data` volume.
#
# Server with HTTPS (`make deploy` with DEPLOY_MODE=docker, see wohnung-deploy):
# the server's .env sets COMPOSE_PROFILES=https, DOMAIN, COOKIE_SECURE=true and
# TRUST_PROXY=true, which adds Caddy on 80/443 in front of the app.

services:
  app:
    build: .
    image: wohnung-finden
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/wohnung.sqlite
    # Loopback only: locally the scraper pushes to 127.0.0.1, on a server Caddy proxies.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - wohnung-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 64

  caddy:
    profiles: [https]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    # Host network (Linux servers): Caddy sees the real IPv4/IPv6 client address for
    # X-Forwarded-For (the login rate limit) and reaches the app on loopback.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-}
      APP_PORT: ${PORT:-3000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./ops/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  wohnung-data:
  caddy-data:
  caddy-config:
